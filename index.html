function allSessions(name){return [...db.workouts].reverse().flatMap(w=>(w.items||[]).filter(x=>x.name===name).map(x=>({date:w.ended,sets:(x.sets||[]).filter(s=>s.done!==false)}))).filter(x=>x.sets.length)}
function chartValue(s){const valid=s.filter(x=>+x.reps>0&&+x.weight>0&&x.type!=='W');if(metric==='volume')return valid.reduce((n,x)=>n+(+x.weight)*(+x.reps),0);if(metric==='oneRM')return Math.max(0,...valid.filter(x=>+x.reps<=12).map(x=>+x.weight*(1+(+x.reps-1)/30)));return Math.max(0,...valid.map(x=>+x.weight))}
function chart(name){let ps=allSessions(name).map(s=>({...s,v:chartValue(s.sets)})).filter(s=>s.v>0).slice(-12);if(!ps.length)return '<p class="muted">Record a weighted set to create a chart.</p>';let min=Math.min(...ps.map(p=>p.v))*.9,max=Math.max(...ps.map(p=>p.v))*1.1||1;let x=i=>35+(ps.length===1?140:i*280/(ps.length-1)),y=v=>18+(max-v)/(max-min||1)*110;return `<svg class="chart" viewBox="0 0 340 165" role="img" aria-label="Exercise strength history">${[0,.5,1].map(z=>{let yy=y(min+(max-min)*z);return `<line x1="35" y1="${yy}" x2="330" y2="${yy}" stroke="var(--border)"/>`}).join('')}<polyline points="${ps.map((p,i)=>x(i)+','+y(p.v)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3"/>${ps.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--accent)"/>`).join('')}<text x="35" y="158" font-size="10" fill="var(--muted)">${when(ps[0].date)}</text><text x="330" y="158" font-size="10" text-anchor="end" fill="var(--muted)">${when(ps.at(-1).date)}</text></svg><p class="muted">Latest: ${ps.at(-1).v.toFixed(1)} ${db.unit}${metric==='volume'?' volume':''}</p>`}
function home(){return head('Your training hub','Track every rep. Build your strength.')+`<div class="stats"><div class="stat"><b>${db.workouts.length}</b><span>Workouts</span></div><div class="stat"><b>${db.workouts.reduce((n,w)=>n+sets(w),0)}</b><span>Completed sets</span></div><div class="stat"><b>${db.workouts.filter(w=>Date.now()-new Date(w.ended).getTime()<7*86400000).length}</b><span>Last 7 days</span></div></div><div class="card"><h3>${db.active?'Workout in progress':'Ready to train?'}</h3><p class="muted">${db.active?'Continue your saved workout.':'Start fresh or choose a routine below.'}</p><button data-a="${db.active?'resume':'empty'}">${db.active?'Continue workout':'Start empty workout'} →</button></div><h2>Quick start</h2>`+db.routines.slice(0,5).map((r,i)=>`<div class="card row"><div><b>${clean(r.name)}</b><p class="muted">${r.exercises.length} exercises</p></div><button data-a="start" data-i="${i}">Start</button></div>`).join('')+`<h2>Recent workouts</h2>`+(db.workouts.slice(0,3).map(w=>`<div class="card"><b>${clean(w.name)}</b><p class="muted">${when(w.ended)} • ${sets(w)} sets • ${elapsed(w.started,w.ended)}</p></div>`).join('')||'<p class="muted">No workouts completed yet.</p>')+`<p class="muted">Your data stays in this browser. Export backups from Progress regularly.</p>`}
function workout(){if(summary)return head('Workout complete!','Your completed sets have been saved.')+`<div class="stats"><div class="stat"><b>${sets(summary.w)}</b><span>Sets</span></div><div class="stat"><b>${Math.round(volume(summary.w))}</b><span>${db.unit} volume</span></div><div class="stat"><b>${elapsed(summary.w.started,summary.w.ended)}</b><span>Duration</span></div></div>${summary.records.length?'<div class="notice">New personal records: '+summary.records.map(clean).join(', ')+'</div>':''}<button data-a="progress">View progress →</button>`;
if(!db.active)return head('Workout','Choose an existing routine or start from scratch.')+`<button data-a="empty">+ Start empty workout</button>`+db.routines.map((r,i)=>`<div class="card row"><div><b>${clean(r.name)}</b><p class="muted">${r.exercises.length} exercises</p></div><button data-a="start" data-i="${i}">Start</button></div>`).join('');
let w=db.active;return head(clean(w.name),'Log sets, reps, weight, RPE and notes.')+`<div class="card row"><div><b id="elapsed">${elapsed(w.started,new Date())}</b> <small>elapsed</small><p class="muted">${w.items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0)} completed sets</p></div><button class="danger sm" data-a="discard">Discard</button></div>`+w.items.map((x,i)=>{let p=previous(x.name);return `<div class="card"><div class="row"><div><h3>${clean(x.name)}</h3><small>Previous: ${p.length} sets • Best ${pr(x.name)} ${db.unit}</small></div><button class="alt sm" data-a="remove" data-i="${i}">Remove</button></div><div class="setrow"><small>TYPE</small><small>WEIGHT</small><small>REPS</small><small>RPE</small><small>DONE</small></div>${x.sets.map((s,j)=>`<div class="setrow ${s.done?'done':''}"><select data-f="type" data-i="${i}" data-j="${j}">${['N','W','D','F'].map(v=>`<option ${v===s.type?'selected':''}>${v}</option>`).join('')}</select><input type="number" inputmode="decimal" min="0" step="0.5" value="${+s.weight||0}" data-f="weight" data-i="${i}" data-j="${j}"><input type="number" min="0" inputmode="numeric" value="${+s.reps||0}" data-f="reps" data-i="${i}" data-j="${j}"><input type="number" min="0" max="10" step="0.5" value="${clean(s.rpe||'')}" data-f="rpe" data-i="${i}" data-j="${j}"><button class="${s.done?'':'alt'}" data-a="check" data-i="${i}" data-j="${j}">${s.done?'✓':'○'}</button></div><p class="muted">Set ${j+1} · Previous: ${p[j]?`${+p[j].weight||0} ${db.unit} × ${+p[j].reps||0}`:'—'}</p>`).join('')}<div class="wrap"><button class="alt sm" data-a="addSet" data-i="${i}">+ Set</button><button class="alt sm" data-a="removeSet" data-i="${i}">− Set</button><button class="alt sm" data-a="rest" data-i="${i}">Rest ${x.restSeconds??db.restSeconds}s</button><button class="alt sm" data-a="editRest" data-i="${i}">Edit rest</button></div><label>Exercise notes</label><textarea data-note="${i}" placeholder="Notes for today">${clean(x.notes||'')}</textarea></div>`}).join('')+`<div class="stack"><button data-a="addExercise">+ Add exercise</button><button data-a="finish">✓ Finish workout</button></div><p class="muted">N normal • W warm-up • D drop • F failure. Only checked sets are saved.</p>`}
function filtered(){return listing().filter(x=>(muscle==='All'||muscle===x.muscle)&&(equipment==='All'||equipment===equip(x.name))&&(!favOnly||db.favorites.includes(x.name))&&(`${x.name} ${x.muscle} ${equip(x.name)}`).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>Number(db.favorites.includes(b.name))-Number(db.favorites.includes(a.name))||a.name.localeCompare(b.name))}
function cards(){let arr=filtered();return `<p class="muted">Showing ${Math.min(shown,arr.length)} of ${arr.length} matching exercises (${listing().length} total)</p>`+arr.slice(0,shown).map(x=>`<div class="card exercise"><div class="thumb">${muscleArt(x.muscle,true)}</div><div class="grow"><b>${clean(x.name)}</b><p class="muted">${clean(x.muscle)} • ${clean(equip(x.name))}</p><div class="wrap"><button class="alt sm" data-a="favorite" data-n="${enc(x.name)}">${db.favorites.includes(x.name)?'♥':'♡'}</button><button class="alt sm" data-a="detail" data-n="${enc(x.name)}">Details</button><button class="sm" data-a="choose" data-n="${enc(x.name)}">${picker?'Add':'+ Workout'}</button></div></div></div>`).join('')+(arr.length>shown?'<button class="alt" data-a="more">Show more</button>':'')}
function exerciseDetail(){let x=listing().find(e=>e.name===detail);if(!x)return '';let tips=trainingTips[detail]||['Use an appropriate and controllable load.','Keep your position stable and avoid jerking.','Move through a comfortable range with controlled repetitions.'];let ss=allSessions(detail);return head(clean(detail),`${clean(x.muscle)} • ${clean(equip(detail))}`)+`<button class="alt sm" data-a="back">← Exercises</button><div class="card row"><div>${muscleArt(x.muscle)}<p class="muted">Simplified muscle diagram</p></div><div><b>${ss.length} sessions</b><p class="muted">Best: ${pr(detail)} ${db.unit}</p><button data-a="choose" data-n="${enc(detail)}">+ Workout</button><p><button class="alt sm" data-a="favorite" data-n="${enc(detail)}">${db.favorites.includes(detail)?'♥ Favorited':'♡ Favorite'}</button></p></div></div><div class="card"><h3>${trainingTips[detail]?'Exercise instructions':'General technique guidance'}</h3><ol>${tips.map(t=>`<li>${clean(t)}</li>`).join('')}</ol></div><h2>Strength progression</h2><div class="card"><div class="scroll">${[['weight','Top weight'],['oneRM','Estimated 1RM'],['volume','Volume']].map(([k,v])=>`<button data-a="metric" data-n="${k}" class="${metric===k?'on':''}">${v}</button>`).join('')}</div>${chart(detail)}<p class="muted">Estimated 1RM is a mathematical estimate, not a tested maximum.</p></div><h2>Exercise history</h2>`+(ss.slice().reverse().slice(0,8).map(s=>`<div class="card"><b>${when(s.date)}</b><p class="muted">${s.sets.map(t=>`${+t.weight||0} ${db.unit} × ${+t.reps||0}`).join(' • ')}</p></div>`).join('')||'<p class="muted">No completed sessions yet.</p>')}
function library(){if(detail)return exerciseDetail();return head('Exercise library',`${listing().length} exercises • Search, favorites, muscle and equipment filters`)+(picker==='routine'?`<div class="notice"><b>Building routine: ${clean(draft.name)}</b><p class="muted">${draft.exercises.map(clean).join(' • ')}</p><button data-a="saveRoutine">Save routine</button> <button class="alt" data-a="cancel">Cancel</button></div>`:picker==='workout'?`<div class="notice">Choose an exercise. <button class="alt sm" data-a="cancel">Cancel</button></div>`:'')+`<input id="query" value="${clean(search)}" placeholder="Search exercise or muscle..." aria-label="Search exercises"><div class="scroll">${['All',...muscles].map(m=>`<button class="${muscle===m?'on':''}" data-a="muscle" data-n="${enc(m)}">${clean(m)}</button>`).join('')}</div><div class="scroll">${['All','Barbell','Dumbbell','Cable','Machine','Smith Machine','Kettlebell','EZ Bar','Resistance Band','Landmine','Bodyweight','Other'].map(m=>`<button class="${equipment===m?'on':''}" data-a="equipment" data-n="${enc(m)}">${m}</button>`).join('')}</div><div class="row"><button class="${favOnly?'':'alt'} sm" data-a="favorites">♥ Favorites</button><button class="alt sm" data-a="custom">+ Custom exercise</button></div><div id="results">${cards()}</div>`}
function routines(){return head('Routines','Create and reuse unlimited workout plans.')+`<button data-a="newRoutine">+ New routine</button>`+db.routines.map((r,i)=>`<div class="card"><div class="row"><h3>${clean(r.name)}</h3><button data-a="start" data-i="${i}">Start</button></div><p class="muted">${r.exercises.map(clean).join(' • ')}</p><div class="wrap"><button class="alt sm" data-a="editRoutine" data-i="${i}">Edit</button><button class="danger sm" data-a="deleteRoutine" data-i="${i}">Delete</button></div></div>`).join('')}

/* REPLEDGER V0.5 — TRAINING ANALYTICS. All stats derive from existing workout records. */
let v5Month=new Date();v5Month.setDate(1);v5Month.setHours(12,0,0,0);
let v5Chosen='',v5Range='30',v5Expanded=-1,v5PrSearch='';
const v5Today=()=>v5DateKey(new Date());
function v5DateKey(raw){const d=new Date(raw);return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function v5DayNumber(k){if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return NaN;let [y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/86400000)}
function v5Display(k){if(!k)return '';let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
const v5WorkoutDate=w=>v5DateKey(w.ended||w.started);
const v5GoodSets=x=>(x.sets||[]).filter(s=>s.done!==false&&s.type!=='W'&&(+s.reps||0)>0);
const v5Working=w=>(w.items||[]).reduce((n,x)=>n+v5GoodSets(x).length,0);
const v5WorkVolume=w=>(w.items||[]).reduce((n,x)=>n+v5GoodSets(x).reduce((a,s)=>a+(+s.weight||0)*(+s.reps||0),0),0);
function v5WithinRange(w){if(v5Range==='all')return true;let delta=v5DayNumber(v5Today())-v5DayNumber(v5WorkoutDate(w));return Number.isFinite(delta)&&delta>=0&&delta<Number(v5Range)}
function v5Sessions(){return db.workouts.filter(v5WithinRange)}
const v5Num=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:1});
function v5Calendar(){
 const year=v5Month.getFullYear(),month=v5Month.getMonth();
 const first=new Date(year,month,1),count=new Date(year,month+1,0).getDate();
 const tally={};db.workouts.forEach(w=>{let k=v5WorkoutDate(w);if(k)tally[k]=(tally[k]||0)+1});
 if(!v5Chosen)v5Chosen=v5Today();
 const cells=Array.from({length:first.getDay()},()=>'<span class="v5-blank"></span>').concat(
 Array.from({length:count},(_,index)=>{let n=index+1,k=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;return `<button title="${tally[k]||0} workout(s)" aria-label="${v5Display(k)}: ${tally[k]||0} workouts" class="v5-day ${tally[k]?'trained':''} ${k===v5Chosen?'selected':''} ${k===v5Today()?'today':''}" data-v5="day" data-k="${k}"><span>${n}</span>${tally[k]?'<i></i>':''}</button>`}));
 const chosen=db.workouts.map((w,i)=>({w,i})).filter(x=>v5WorkoutDate(x.w)===v5Chosen);
 return `<section class="card"><div class="row"><div><h3>Training calendar</h3><p class="muted">Tap a highlighted date to view its sessions.</p></div><button class="alt sm" data-v5="today">Today</button></div>
 <div class="row v5-month"><button class="alt sm" data-v5="prevMonth" aria-label="Previous month">‹</button><b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="alt sm" data-v5="nextMonth" aria-label="Next month">›</button></div>
 <div class="v5-calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(s=>`<span class="v5-weekday">${s}</span>`).join('')}${cells.join('')}</div>
 <div class="v5-selected"><b>${v5Display(v5Chosen)}</b><span class="muted">${chosen.length} workout${chosen.length===1?'':'s'}</span></div>
 ${chosen.length?chosen.map(({w,i})=>v5HistoryRow(w,i)).join(''):'<p class="muted">No workouts saved for this date.</p>'}</section>`;
}
function v5HistoryRow(w,i){return `<div class="v5-session"><div class="row"><div><b>${clean(w.name)}</b><div class="muted">${sets(w)} sets · ${v5Num(v5WorkVolume(w))} ${db.unit} working volume · ${elapsed(w.started,w.ended||w.started)}</div></div><button class="alt sm" data-v5="expand" data-i="${i}">${v5Expanded===i?'Close':'Details'}</button></div>${v5Expanded===i?`<div class="v5-session-detail">${(w.items||[]).map(x=>`<div class="v5-detail-ex"><b>${clean(x.name)}</b><div class="muted">${(x.sets||[]).filter(s=>s.done!==false).map(s=>`${clean(s.type||'N')}: ${v5Num(s.weight)} ${db.unit} × ${v5Num(s.reps)}`).join(' · ')||'No sets'}</div>${x.notes?`<div class="muted">${clean(x.notes)}</div>`:''}</div>`).join('')}</div>`:''}</div>`}
function v5Bars(){
 const duration=v5Range==='all'?null:Number(v5Range);
 const all=db.workouts.filter(w=>v5WorkoutDate(w));
 const today=v5DayNumber(v5Today());
 const oldest=all.length?Math.min(...all.map(w=>v5DayNumber(v5WorkoutDate(w)))):today;
 const days=duration||Math.max(1,today-oldest+1);
 const bins=duration===7?7:duration===30?6:duration===90?10:12;
 const size=Math.max(1,Math.ceil(days/bins));
 const values=Array(bins).fill(0),labels=[];
 for(let i=0;i<bins;i++){
   const age=(bins-1-i)*size;
   const d=new Date((today-age)*86400000);
   labels.push(d.toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'}));
 }
 for(const w of v5Sessions()){
  let age=today-v5DayNumber(v5WorkoutDate(w));if(age<0)continue;
  let i=bins-1-Math.floor(age/size);if(i>=0&&i<bins)values[i]+=v5WorkVolume(w);
 }
 const max=Math.max(1,...values);
 const W=480,H=208,x0=42,y0=14,h=155,bw=(W-x0-12)/bins;
 const bars=values.map((v,i)=>{let ht=v/max*(h-8),x=x0+i*bw+bw*.17,y=y0+h-ht;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.66).toFixed(1)}" height="${Math.max(ht,0).toFixed(1)}" rx="3" fill="var(--accent)"><title>${labels[i]}: ${v5Num(v)} ${db.unit}</title></rect>`}).join('');
 return `<section class="card"><div class="row"><h3>Training volume</h3><span class="muted">Working sets · ${db.unit} × reps</span></div>
 <div class="v5-filters">${[['7','7 days'],['30','30 days'],['90','90 days'],['365','1 year'],['all','All']].map(([v,t])=>`<button class="${v5Range===v?'on':'alt'} sm" data-v5="range" data-k="${v}">${t}</button>`).join('')}</div>
 <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Training volume by time period">
 ${[0,.5,1].map(f=>{let y=y0+h-h*f;return `<line x1="${x0}" y1="${y}" x2="${W-9}" y2="${y}" stroke="var(--border)"/><text x="${x0-6}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v5Num(max*f)}</text>`}).join('')}
 ${bars}${labels.map((s,i)=>`<text x="${(x0+(i+.5)*bw).toFixed(1)}" y="${H-17}" text-anchor="middle" font-size="${bins>10?8:10}" fill="var(--muted)">${s}</text>`).join('')}</svg>
 <p class="muted">Volume = weight × reps on completed non-warm-up sets. Bodyweight movements with no entered load contribute zero volume.</p></section>`
}
function v5MuscleChart(){
 const lookup=new Map(listing().map(x=>[x.name,x.muscle]));const totals={};let total=0;
 for(const w of v5Sessions())for(const x of w.items||[]){let group=lookup.get(x.name)||'Other/Custom';let n=v5GoodSets(x).length;if(!n)continue;totals[group]=(totals[group]||0)+n;total+=n}
 let arr=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
 return `<section class="card"><div class="row"><h3>Muscle group balance</h3><span class="muted">${total} working sets</span></div>
 ${arr.length?arr.map(([muscle,n])=>`<div class="v5-muscle"><div class="row"><b>${clean(muscle)}</b><span class="muted">${n} set${n===1?'':'s'} · ${Math.round(n/total*100)}%</span></div><div class="v5-track"><span style="width:${n/total*100}%"></span></div></div>`).join(''):'<p class="muted">Complete a workout to see muscle distribution.</p>'}
 <p class="muted">Each completed non-warm-up set counts once toward an exercise's primary category. Secondary muscles are not included.</p></section>`
}
function v5PRs(){
 let map=new Map();
 for(const w of [...db.workouts].reverse())for(const x of w.items||[]){
  let p=map.get(x.name)||{name:x.name,best:0,oneRM:0,reps:0,volume:0,sessions:0};
  let working=v5GoodSets(x);if(!working.length)continue;
  p.sessions++;
  p.volume=Math.max(p.volume,working.reduce((a,s)=>a+(+s.weight||0)*(+s.reps||0),0));
  for(const s of working){let wt=+s.weight||0,r=+s.reps||0;p.best=Math.max(p.best,wt);p.reps=Math.max(p.reps,r);
   if(wt>0&&r>=1&&r<=12)p.oneRM=Math.max(p.oneRM,r===1?wt:wt*(1+r/30));
  }
  map.set(x.name,p)
 }
 return [...map.values()].sort((a,b)=>b.sessions-a.sessions||a.name.localeCompare(b.name));
}
function v5Records(){let records=v5PRs();let matching=records.filter(x=>x.name.toLowerCase().includes(v5PrSearch.toLowerCase()));
 return `<section class="card"><div class="row"><h3>Personal records</h3><span class="muted">${records.length} exercises</span></div>
 <label for="v5PrSearch">Find an exercise</label><input id="v5PrSearch" placeholder="Search your exercise records" value="${clean(v5PrSearch)}" aria-label="Search personal records">
 <div id="v5PrResults">${v5RecordCards(matching)}</div>
 <p class="muted">Estimated 1RM uses the Epley formula on loaded sets of 1–12 repetitions. Estimates are not measured max lifts.</p></section>`
}
function v5RecordCards(arr){return arr.length?arr.slice(0,30).map(p=>`<div class="v5-pr"><b>${clean(p.name)}</b><div class="v5-pr-grid"><span><small>Heaviest</small><strong>${v5Num(p.best)} ${db.unit}</strong></span><span><small>Est. 1RM</small><strong>${p.oneRM?v5Num(Math.round(p.oneRM))+' '+db.unit:'—'}</strong></span><span><small>Most reps*</small><strong>${p.reps}</strong></span><span><small>Best session volume</small><strong>${v5Num(p.volume)} ${db.unit}</strong></span></div></div>`).join('')+'<p class="muted">*Most reps in a completed working set, regardless of weight.</p>':'<p class="muted">No matching records. Complete sets to create them.</p>'}
function v5History(){return `<section class="card"><div class="row"><h3>Workout history</h3><span class="muted">${db.workouts.length} total</span></div>
 ${db.workouts.length?db.workouts.slice(0,40).map((w,i)=>`<div class="v5-history"><div class="row"><div><b>${clean(w.name)}</b><div class="muted">${when(w.ended||w.started)} · ${sets(w)} sets · ${v5Num(v5WorkVolume(w))} ${db.unit} working volume</div></div><div class="wrap"><button class="alt sm" data-v5="expand" data-i="${i}">${v5Expanded===i?'Close':'Details'}</button><button class="danger sm" data-a="deleteWorkout" data-i="${i}" aria-label="Delete ${clean(w.name)}">×</button></div></div>

 v6OriginalBegin(name,names);
 // If the user declined replacing an unfinished workout, leave it untouched.
 if(oldActive&&db.active===oldActive)return;
 let w=db.active;if(!w)return;
 const routine=db.routines.find(r=>r.name===name&&JSON.stringify(r.exercises)===JSON.stringify(names));
 if(routine){
 w.routineSource=routine.name;
 w.items.forEach((x,i)=>{let g=v6Goal(routine,x.name);x.targetMin=g.min;x.targetMax=g.max;
 x.sets=Array.from({length:g.count},(_,j)=>x.sets[j]||{weight:+x.sets.at(-1)?.weight||0,reps:g.min,done:false,type:'N',rpe:''});
 });
 save();draw();
 }
};
function v6OpenEditor(i){
 const r=i<0?{name:'New Routine',exercises:[],folder:'',goals:{}}:db.routines[i];
 if(!r)return;
 if(i<0){const n=prompt('Routine name',r.name);if(!n?.trim())return;r.name=n.trim()}
 let goals={};for(const [k,v] of Object.entries(r.goals||{}))goals[k]={...v};
 draft={name:r.name,exercises:[...r.exercises],folder:r.folder||'',goals,edit:i};
 picker='routine';tab='exercises';detail='';search='';draw();
}
function v6SaveDraft(){
 if(!draft||!draft.exercises.length){alert('Add at least one exercise.');return}
 const saveRoutine={name:draft.name,folder:draft.folder||'',exercises:[...draft.exercises],goals:{...draft.goals}};
 if(draft.edit>=0)db.routines[draft.edit]=saveRoutine;else db.routines.push(saveRoutine);
 draft=null;picker='';save();go('routines');
}
async function v6MergeBackup(file){
 let other;
 try{other=JSON.parse(await file.text());if(!other||!Array.isArray(other.workouts)||!Array.isArray(other.routines))throw Error('Invalid RepLedger backup')}
 catch(e){alert('Could not read a valid RepLedger JSON backup.');return}
 const known=new Set(db.workouts.map(w=>JSON.stringify([w.started,w.ended,w.name,w.items])));
 let inserted=0;
 for(const w of other.workouts){
 if(!w||typeof w!=='object'||!Array.isArray(w.items))continue;
 const fingerprint=JSON.stringify([w.started,w.ended,w.name,w.items]);
 if(known.has(fingerprint))continue;
 db.workouts.push(w);known.add(fingerprint);inserted++;
 }
 db.workouts.sort((a,b)=>new Date(b.ended||b.started)-new Date(a.ended||a.started));
 for(const r of other.routines){
 if(!r||typeof r.name!=='string'||!Array.isArray(r.exercises))continue;
 if(!db.routines.some(t=>t.name===r.name&&JSON.stringify(t.exercises)===JSON.stringify(r.exercises)))db.routines.push(r);
 }
 const customs=Array.isArray(other.custom)?other.custom:[];
 for(const x of customs)if(x&&x.name&&!db.custom.some(t=>t.name===x.name))db.custom.push(x);
 db.favorites=[...new Set([...db.favorites,...(Array.isArray(other.favorites)?other.favorites:[])])];
 db.folders=[...new Set([...db.folders,...(Array.isArray(other.folders)?other.folders:[])])];
 save();draw();alert(`Backup merged. Added ${inserted} workout(s). Existing workouts were kept.`);
}
document.addEventListener('change',async e=>{
 if(e.target.id==='v6MergeBackup'&&e.target.files?.[0])await v6MergeBackup(e.target.files[0]);
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-v6]');if(!b)return;
 const a=b.dataset.v6,i=Number(b.dataset.i),value=dec(b.dataset.name||'');
 if(a==='plate-toggle'){v6PlateOpen=!v6PlateOpen;draw()}
 if(a==='workout-rename'){let n=prompt('Workout name',db.active.name);if(n?.trim()){db.active.name=n.trim();save();draw()}}
 if(a==='warmup'){
 let x=db.active.items[i],working=x.sets.find(s=>s.type!=='W');
 let weight=+working?.weight||0;if(!weight){weight=Number(prompt(`Working weight for ${x.name} (${db.unit})`, '0'))||0}
 if(weight<=0){alert('Enter a working weight first.');return}
 const round=db.unit==='kg'?2.5:5;
 const warm=[{weight:Math.round(weight*.4/round)*round,reps:10,type:'W',rpe:'',done:false},{weight:Math.round(weight*.6/round)*round,reps:5,type:'W',rpe:'',done:false}];
 x.sets.unshift(...warm);save();draw();
 }
 if(a==='set-goal'){
 const x=db.active.items[i];let low=prompt('Minimum target repetitions',String(x.targetMin??8));if(low===null)return;
 let high=prompt('Maximum target repetitions',String(x.targetMax??12));if(high===null)return;
 x.targetMin=v6Integer(low,1,30);x.targetMax=Math.max(x.targetMin,v6Integer(high,1,40));save();draw();
 }
 if(a==='reorder'){
 let j=i+(b.dataset.direction==='up'?-1:1),arr=db.active.items;
 if(j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];save();draw()}
 }
 if(a==='superset'){
 let arr=db.active.items,x=arr[i];
 const opts=arr.map((item,j)=>j===i?null:`${j+1}. ${item.name}`).filter(Boolean);
 if(!opts.length){alert('Add another exercise to create a superset.');return}
 let answer=prompt(`Group ${x.name} into a superset with:\n${opts.join('\n')}\nEnter exercise number, or 0 to unlink:`,String(i===0?2:1));
 if(answer===null)return;let j=Number(answer)-1;
 if(answer==='0'){delete x.supersetGroup;save();draw();return}
 if(!Number.isInteger(j)||j<0||j>=arr.length||j===i){alert('Choose a valid other exercise number.');return}
 let partner=arr[j],group=partner.supersetGroup||x.supersetGroup||`SG${Date.now()}`;
 x.supersetGroup=group;partner.supersetGroup=group;save();draw();
 }
 if(a==='apply-suggestion'){
 const x=db.active.items[i],hint=v6Suggestion(x);
 if(hint.weight===null)return;
 for(const s of x.sets)if(!s.done&&s.type!=='W'){s.weight=hint.weight;s.reps=hint.reps}
 save();draw();
 }
 if(a==='new-folder'){
 let name=prompt('Folder name (e.g. Push/Pull/Legs)');if(!name?.trim())return;
 if(!db.folders.includes(name.trim()))db.folders.push(name.trim());save();v6Folder=name.trim();draw();
 }
 if(a==='folder-filter'){v6Folder=value;draw()}
 if(a==='new-routine')v6OpenEditor(-1);
 if(a==='edit-routine')v6OpenEditor(i);
 if(a==='start-routine'){
 let r=db.routines[i];if(r)begin(r.name,r.exercises);
 }
 if(a==='duplicate'){
 let r=db.routines[i];if(!r)return;
 db.routines.push({...structuredClone(r),name:r.name+' (Copy)'});save();draw();
 }
 if(a==='move-folder'){
 let r=db.routines[i];if(!r)return;
 let target=prompt('Folder name (blank for Unfiled)',r.folder||'');if(target===null)return;
 r.folder=target.trim();if(r.folder&&!db.folders.includes(r.folder))db.folders.push(r.folder);save();draw();
 }
 if(a==='delete-routine'&&confirm('Delete this routine? Completed workouts will be kept.')){db.routines.splice(i,1);save();draw()}
 if(a==='routine-remove'){draft.exercises.splice(i,1);draw()}
 if(a==='routine-up'||a==='routine-down'){
 let j=i+(a==='routine-up'?-1:1);if(j>=0&&j<draft.exercises.length){[draft.exercises[i],draft.exercises[j]]=[draft.exercises[j],draft.exercises[i]];draw()}
 }
 if(a==='routine-goal'){
 let name=draft.exercises[i],g=v6Goal(draft,name);
 let c=prompt(`Target sets for ${name}`,String(g.count));if(c===null)return;
 let min=prompt('Minimum target reps',String(g.min));if(min===null)return;
 let max=prompt('Maximum target reps',String(g.max));if(max===null)return;
 draft.goals[name]={count:v6Integer(c,1,12),min:v6Integer(min,1,30),max:Math.max(v6Integer(min,1,30),v6Integer(max,1,40))};draw();
 }
 if(a==='save-routine')v6SaveDraft();
});
document.addEventListener('change',e=>{
 if(e.target.id==='v6PlateTarget'||e.target.id==='v6BarWeight'){
 const num=Math.max(0,Number(e.target.value)||0);
 if(e.target.id==='v6PlateTarget')v6PlateTarget=num;else v6Bar=num;
 draw();
 }
});
const v6Styles=document.createElement('style');
v6Styles.textContent=`
 .v6-exercise{border-top:3px solid var(--accent)}
 .v6-group{padding:8px 10px;color:var(--fg);background:var(--soft);border-radius:9px;font-size:12px;margin:10px 0}
 .v6-target{color:var(--accent);font-size:12px;margin:10px 0;font-weight:700}
 .v6-coach{margin:12px 0;background:var(--soft);border-left:3px solid var(--accent);border-radius:8px;padding:11px}
 .v6-coach p{font-size:12px;line-height:1.5;color:var(--muted);margin:6px 0}
 .v6-plate .v6-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
 .v6-plan{padding:12px 0;border-top:1px solid var(--border)}
 .v6-plan .wrap{margin-top:8px}
 .v6-data{border:2px solid var(--accent)}
 .v6-data .stats{margin:10px 0}
 `;
document.head.appendChild(v6Styles);
/* END VERSION 0.6 */

draw();
</script>
