const exercises=[],known=new Set();
for(const [m,names] of Object.entries(groups))
for(const name of names){known.add(name.toLowerCase());exercises.push({name,muscle:m})}
for(const [m,names] of Object.entries(extra))
for(const name of names.split('|')){
if(known.has(name.toLowerCase()))continue;
known.add(name.toLowerCase());exercises.push({name,muscle:m});
}
const muscles=[...new Set(exercises.map(x=>x.muscle))];
const starter=[
{name:'Push Day',exercises:['Barbell Bench Press','Incline Dumbbell Press','Seated Dumbbell Shoulder Press','Lateral Raise','Triceps Pushdown']},
{name:'Pull Day',exercises:['Lat Pulldown','Seated Cable Row','One-Arm Dumbbell Row','Face Pull','Hammer Curl']},
{name:'Leg Day',exercises:['Barbell Back Squat','Romanian Deadlift','Leg Press','Leg Curl','Standing Calf Raise']}
];
const KEY='repledger-free-v1';
const defaults=()=>({workouts:[],active:null,routines:JSON.parse(JSON.stringify(starter)),custom:[],unit:'lb',restSeconds:90,theme:'dark',timerEnd:0,favorites:[]});
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{db=defaults()}
if(!db||!Array.isArray(db.workouts)||!Array.isArray(db.routines))db=defaults();
db.custom=Array.isArray(db.custom)?db.custom:[];
db.favorites=Array.isArray(db.favorites)?db.favorites:[];
db.unit=db.unit==='kg'?'kg':'lb';
db.theme=db.theme==='light'?'light':'dark';
db.restSeconds=Number.isFinite(+db.restSeconds)?Math.max(0,+db.restSeconds):90;
db.timerEnd=Number(db.timerEnd)||0;
let tab='home',picker='',draft=null,search='',muscle='All',equipment='All',favOnly=false,shown=40,detail='',metric='weight',summary=null;
const $=s=>document.getElementById(s);
const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent,dec=decodeURIComponent;
const listing=()=>[...exercises,...db.custom];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Storage unavailable. Export a backup soon.')}};
const head=(s,t)=>`<div class="eyebrow">RepLedger • Version 0.5</div><h1>${s}</h1><p class="muted">${t}</p>`;
const when=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const secs=(start,end)=>Math.max(0,Math.floor((new Date(end)-new Date(start))/1000));
const elapsed=(a,b)=>{let n=secs(a,b);return `${Math.floor(n/3600)?Math.floor(n/3600)+'h ':''}${Math.floor(n%3600/60)}m`};
const sets=w=>(w.items||[]).reduce((n,x)=>n+(x.sets||[]).filter(s=>s.done!==false).length,0);
const volume=w=>(w.items||[]).reduce((n,x)=>n+(x.sets||[]).filter(s=>s.done!==false).reduce((a,s)=>a+(+s.weight||0)*(+s.reps||0),0),0);
function previous(name){
for(const w of db.workouts){
const x=(w.items||[]).find(x=>x.name===name);
const s=(x?.sets||[]).filter(s=>s.done!==false);
if(s.length)return s;
}return [];
}
function pr(name){
return Math.max(0,...db.workouts.flatMap(w=>(w.items||[]).filter(x=>x.name===name).flatMap(x=>(x.sets||[]).filter(s=>s.done!==false).map(s=>+s.weight||0))));
}
function newItem(name){
const p=previous(name);
return {name,notes:'',restSeconds:db.restSeconds,sets:[0,1,2].map(i=>({weight:+p[i]?.weight||0,reps:+p[i]?.reps||10,rpe:'',type:'N',done:false}))};
}
function equip(name){
if(/dumbbell/i.test(name))return 'Dumbbell';
if(/smith/i.test(name))return 'Smith Machine';
if(/ez.bar/i.test(name))return 'EZ Bar';
if(/kettlebell/i.test(name))return 'Kettlebell';
if(/landmine/i.test(name))return 'Landmine';
if(/cable|pulldown|pushdown/i.test(name))return 'Cable';
if(/machine|leg press|pec deck/i.test(name))return 'Machine';
if(/band/i.test(name))return 'Resistance Band';
if(/barbell|deadlift|squat|bench press/i.test(name))return 'Barbell';
if(/curl|raise|fly/i.test(name))return 'Other';

}

function chartValue(s){
const valid=s.filter(x=>+x.reps>0&&+x.weight>0&&x.type!=='W');

<button class="danger sm" data-a="deleteWorkout" data-i="${i}" aria-label="Delete ${clean(w.name)}">×</button></div></div>
${v5Expanded===i?`<div class="v5-session-detail">${(w.items||[]).map(x=>`<div class="v5-detail-ex"><b>${clean(x.name)}</b>
<div class="muted">${(x.sets||[]).filter(s=>s.done!==false).map(s=>`${clean(s.type||'N')}: ${v5Num(s.weight)} ${db.unit} × ${v5Num(s.reps)}`).join(' · ')}</div></div>`).join('')}</div>`:''}</div>`).join(''):'<p class="muted">No workouts saved yet.</p>'}
${db.workouts.length>40?'<p class="muted">Showing the 40 most recent workouts. Older sessions remain saved.</p>':''}</section>`;
}
function v5Settings(){
return `<section class="card stack"><h3>Settings & data safety</h3>
<div class="row"><span>Weight units</span><button class="alt" data-a="unit">${db.unit} ↔ ${db.unit==='lb'?'kg':'lb'}</button></div>
<div class="row"><span>Appearance</span><button class="alt" data-a="theme">${clean(db.theme)}</button></div>
<div class="row"><span>Default rest</span><button class="alt" data-a="restDefault">${db.restSeconds}s</button></div>
<button data-a="backup">Export JSON backup</button>
<label>Import a RepLedger JSON backup<input type="file" id="import" accept=".json,application/json"></label>
<p class="muted">Saved workouts stay in this browser's local storage. Export backups regularly; private browsing or clearing site data can erase them. GitHub does not store your workout history.</p></section>`;
}
function progress(){
const list=v5Sessions();
const totalVolume=list.reduce((s,w)=>s+v5WorkVolume(w),0);
const activeDays=new Set(list.map(v5WorkoutDate)).size;
return head('Progress & analytics','Track training consistency, working volume, muscle balance, and records.')+
`<div class="stats">
<div class="stat"><b>${list.length}</b><span>Workouts</span></div>
<div class="stat"><b>${list.reduce((n,w)=>n+v5Working(w),0)}</b><span>Working sets</span></div>
<div class="stat"><b>${v5Num(totalVolume)}</b><span>${db.unit} volume</span></div></div>
<p class="muted" style="text-align:center">Selected period: ${v5Range==='all'?'All time':v5Range+' days'} · ${activeDays} training day${activeDays===1?'':'s'}</p>`+
v5Calendar()+v5Bars()+v5MuscleChart()+v5Records()+v5History()+`<h2>Settings & backup</h2>`+v5Settings();
}
function draw(){
document.body.classList.toggle('light',db.theme==='light');
$('app').innerHTML=({home,workout,exercises:library,routines,progress})[tab]();
$('nav').innerHTML=[['home','⌂','Home'],['workout','◆','Workout'],['exercises','▤','Exercises'],['routines','▦','Routines'],['progress','↗','Progress']].map(([k,v,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}"><b>${v}</b>${n}</button>`).join('');
tick();
}
function go(t){
tab=t;detail='';picker='';draft=null;summary=null;
search='';muscle='All';equipment='All';
draw();scrollTo(0,0);
}
function begin(name,names){
if(db.active&&!confirm('Replace the unfinished workout?'))return;
db.active={name,started:new Date().toISOString(),items:names.map(newItem)};
save();go('workout');
}
function rest(sec){db.timerEnd=Date.now()+Math.max(0,sec)*1000;save();tick()}
function tick(){
let n=Math.max(0,Math.ceil((db.timerEnd-Date.now())/1000));
$('rest').style.display=n?'flex':'none';
$('restLabel').textContent=`Rest ${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
if($('elapsed')&&db.active)$('elapsed').textContent=elapsed(db.active.started,new Date());
}
setInterval(tick,1000);
function finish(){
let w=db.active;
if(!w)return;
let items=w.items.map(x=>({...x,sets:x.sets.filter(s=>s.done).map(s=>({...s,done:true}))})).filter(x=>x.sets.length);
if(!items.length){alert('Complete at least one set.');return}
let records=items.filter(x=>Math.max(...x.sets.map(s=>+s.weight||0))>pr(x.name)).map(x=>x.name);
let saved={name:w.name,started:w.started,ended:new Date().toISOString(),items,unit:db.unit};
db.workouts.unshift(saved);
db.active=null;db.timerEnd=0;save();
summary={w:saved,records};
tab='workout';draw();
}
function changeUnit(){
let target=db.unit==='lb'?'kg':'lb';
if(!confirm(`Convert all existing weights to ${target}?`))return;
let mul=target==='kg'?1/2.2046226218:2.2046226218;
for(const w of [...db.workouts,db.active].filter(Boolean))
for(const x of w.items||[])
for(const s of x.sets||[])
s.weight=Math.round((+s.weight||0)*mul*10)/10;
db.unit=target;save();draw();
}
document.addEventListener('click',e=>{
const b=e.target.closest('button[data-v5]');
if(!b)return;
const a=b.dataset.v5,k=b.dataset.k;
if(a==='prevMonth'||a==='nextMonth'){
v5Month.setMonth(v5Month.getMonth()+(a==='prevMonth'?-1:1));
let y=v5Month.getFullYear(),m=v5Month.getMonth()+1;
v5Chosen=`${y}-${String(m).padStart(2,'0')}-01`;
v5Expanded=-1;draw();
}
if(a==='today'){
v5Month=new Date();v5Month.setDate(1);v5Month.setHours(12,0,0,0);
v5Chosen=v5Today();v5Expanded=-1;draw();
}
if(a==='day'){v5Chosen=k;v5Expanded=-1;draw()}
if(a==='range'){v5Range=k;draw()}
if(a==='expand'){v5Expanded=v5Expanded===+b.dataset.i?-1:+b.dataset.i;draw()}
});
document.addEventListener('input',e=>{
if(e.target.id==='v5PrSearch'){
v5PrSearch=e.target.value;
const box=$('v5PrResults');
if(box)box.innerHTML=v5RecordCards(v5PRs().filter(x=>x.name.toLowerCase().includes(v5PrSearch.toLowerCase())));
}
});
document.addEventListener('click',e=>{
let b=e.target.closest('button');
if(!b)return;
if(b.dataset.tab){go(b.dataset.tab);return}
let a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,name=dec(b.dataset.n||'');
if(a==='empty')begin('New Workout',[]);
if(a==='resume')go('workout');
if(a==='start'&&db.routines[i])begin(db.routines[i].name,db.routines[i].exercises);
if(a==='discard'&&confirm('Discard unfinished workout?')){
db.active=null;db.timerEnd=0;save();draw();
}
if(a==='remove'&&confirm('Remove this exercise?')){
db.active.items.splice(i,1);save();draw();
}
if(a==='addSet'){
let x=db.active.items[i],s=x.sets.at(-1);
x.sets.push({weight:+s?.weight||0,reps:+s?.reps||10,type:'N',rpe:'',done:false});
save();draw();
}
if(a==='removeSet'&&db.active.items[i].sets.length&&confirm('Remove the last set?')){
db.active.items[i].sets.pop();save();draw();
}
if(a==='check'){
let s=db.active.items[i].sets[j];
s.done=!s.done;save();
if(s.done)rest(db.active.items[i].restSeconds??db.restSeconds);
draw();
}
if(a==='rest')rest(db.active.items[i].restSeconds??db.restSeconds);
if(a==='editRest'){
let x=db.active.items[i],n=prompt('Rest seconds (0–3600)',String(x.restSeconds??db.restSeconds));
if(n!==null&&+n>=0&&+n<=3600){
x.restSeconds=Math.round(+n);save();draw();
}
}
if(a==='stopRest'){db.timerEnd=0;save();tick()}
if(a==='plus15'||a==='minus15'){
db.timerEnd=Math.max(Date.now(),db.timerEnd+(a==='plus15'?15000:-15000));
save();tick();
}
if(a==='addExercise'){picker='workout';tab='exercises';detail='';draw()}
if(a==='finish')finish();
if(a==='progress')go('progress');
if(a==='muscle'){muscle=name;shown=40;draw()}
if(a==='equipment'){equipment=name;shown=40;draw()}
if(a==='favorites'){favOnly=!favOnly;shown=40;draw()}
if(a==='more'){shown+=40;$('results').innerHTML=cards()}
if(a==='favorite'){
db.favorites=db.favorites.includes(name)?db.favorites.filter(n=>n!==name):[...db.favorites,name];
save();draw();
}
if(a==='detail'){detail=name;metric='weight';draw()}
if(a==='back'){detail='';draw()}
if(a==='metric'){metric=name;draw()}
if(a==='choose'){
if(picker==='routine'){
if(!draft.exercises.includes(name))draft.exercises.push(name);
detail='';draw();
}else{
if(!db.active)db.active={name:'New Workout',started:new Date().toISOString(),items:[]};
db.active.items.push(newItem(name));save();go('workout');
}
}
if(a==='custom'){
let n=prompt('Custom exercise name');
if(!n?.trim())return;
if(listing().some(x=>x.name.toLowerCase()===n.trim().toLowerCase()))return alert('Exercise already exists');
let m=prompt('Muscle group','Custom')||'Custom';
db.custom.push({name:n.trim(),muscle:m.trim()});
save();search=n.trim();draw();
}
if(a==='newRoutine'){
let n=prompt('Routine name','My Workout');
if(n?.trim()){
draft={name:n.trim(),exercises:[],edit:-1};
picker='routine';tab='exercises';draw();
}
}
if(a==='editRoutine'){
let r=db.routines[i];if(!r)return;
let n=prompt('Routine name',r.name);if(n===null)return;
draft={name:n.trim()||r.name,exercises:[...r.exercises],edit:i};
picker='routine';tab='exercises';draw();
}
if(a==='saveRoutine'){
if(!draft?.exercises.length)return alert('Add at least one exercise');
if(draft.edit>=0)db.routines[draft.edit]={name:draft.name,exercises:draft.exercises};
else db.routines.push({name:draft.name,exercises:draft.exercises});
draft=null;picker='';save();go('routines');
}
if(a==='cancel'){go(picker==='routine'?'routines':'workout')}
if(a==='deleteRoutine'&&confirm('Delete this routine?')){
db.routines.splice(i,1);save();draw();
}
if(a==='deleteWorkout'&&confirm('Delete this recorded workout?')){
db.workouts.splice(i,1);save();draw();
}
if(a==='unit')changeUnit();
if(a==='theme'){db.theme=db.theme==='dark'?'light':'dark';save();draw()}
if(a==='restDefault'){
let n=prompt('Default rest seconds',db.restSeconds);
if(n!==null&&+n>=0&&+n<=3600){
db.restSeconds=Math.round(+n);save();draw();
}
}
if(a==='backup'){
let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
let url=URL.createObjectURL(blob),link=document.createElement('a');
link.href=url;link.download='repledger-backup.json';link.click();
setTimeout(()=>URL.revokeObjectURL(url),1500);
}
});
document.addEventListener('input',e=>{
let x=e.target;
if(x.id==='query'){
search=x.value;shown=40;$('results').innerHTML=cards();
}
if(x.dataset.f&&db.active){
let s=db.active.items[+x.dataset.i]?.sets[+x.dataset.j];
if(s){
let f=x.dataset.f;
s[f]=f==='type'?x.value:f==='rpe'&&x.value===''?'':Math.max(0,+x.value||0);
save();
}
}
if(x.dataset.note!==undefined&&db.active){
db.active.items[+x.dataset.note].notes=x.value;save();
}
});
document.addEventListener('change',async e=>{
if(e.target.id!=='import'||!e.target.files?.[0])return;
try{
let d=JSON.parse(await e.target.files[0].text());
if(!Array.isArray(d.workouts)||!Array.isArray(d.routines))throw Error('Invalid backup');
if(confirm('Replace current data with this backup?')){
db={...defaults(),...d};
db.custom=Array.isArray(db.custom)?db.custom:[];
db.favorites=Array.isArray(db.favorites)?db.favorites:[];
save();draw();
}
}catch{alert('Could not import this backup.')}
});
draw();
</script>
</body>
</html>
